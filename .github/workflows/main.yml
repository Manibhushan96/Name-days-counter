name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0 platforms;android-34'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify Android project
        run: |
          test -f ElapsedWidget/settings.gradle.kts
          test -f ElapsedWidget/app/build.gradle.kts

      - name: Build debug APK
        run: gradle -p ElapsedWidget :app:assembleDebug --no-daemon

      - name: Show generated APK
        run: find ElapsedWidget -type f -name '*.apk' -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elapsed-debug-apk
          path: ElapsedWidget/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
